version: '3.8'
services:
  book-service:
    build:
      context: ./book-service-db
      dockerfile: Dockerfile
    image: hw18-book-service-db
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:h2:tcp://h2db:1521/bookstore
      SPRING_DATASOURCE_USERNAME: ${USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${PASSWORD}
    depends_on:
      - h2db

  h2db:
    image: oscarfonts/h2:2.2.224
    container_name: h2db
    restart: always
    ports:
      - "8081:1521"
      - "8082:81"
    environment:
      H2_OPTIONS: "-ifNotExists"
    volumes:
      - h2_data:/opt/h2-data

  book-app:
    build:
      context: ./book-app
      dockerfile: Dockerfile
    image: hw18-book-app
    ports:
      - "8083:8080"
    environment:
      SERVER_BASE_URL: http://book-service:8080/api/v1
    depends_on:
      - book-service

volumes:
  h2_data:
